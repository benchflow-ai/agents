[project]
name = "mini-swe-acp"
version = "0.1.1"
description = "mini-swe-agent as a BenchFlow agent — ACP shim + registration"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    # Requires the private uv bootstrap (uv_install_command(install_packages=False),
    # PY8-D1000-lead), on BenchFlow's 0.8 line from its dev builds on. A higher
    # floor would make a dependency-resolving install replace a dev BenchFlow.
    # benchflow pins litellm to an rc — uv users: --prerelease=allow.
    "benchflow>=0.8.0.dev0",
    "pyyaml>=6",
]

# BenchFlow discovers this package automatically (registry entry-point
# autoload): importing the module registers its agents.
[project.entry-points."benchflow.agents"]
mini-swe-acp = "mini_swe_acp"

[project.urls]
Repository = "https://github.com/benchflow-ai/agents"
Documentation = "https://github.com/benchflow-ai/agents/tree/main/acp/mini-swe-acp#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "ty",
    # The version the sandbox install pins (src/mini_swe_acp/requirements.txt).
    # LiteLLM is not pinned here: this env also holds benchflow, which pins its
    # own LiteLLM for the host proxy.
    "mini-swe-agent==2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_swe_acp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["mini_swe_acp"]
