contract_version = "1.0"
name = "ori"
description = "OpenRouter Ori coding harness via a BenchFlow ACP-over-JSONL shim"
install_cmd = "BF_ORI_BIN=/opt/benchflow/bin/ori; BF_ORI_VERSION=0.12.0+68f9a36; BF_ORI_RELEASE=cli-0.12.0-68f9a36; BF_ORI_CURRENT=\"\"; if [ -x \"$BF_ORI_BIN\" ]; then BF_ORI_CURRENT=$(ORI_TELEMETRY=0 \"$BF_ORI_BIN\" version --human 2>/dev/null | awk 'NF {print $NF; exit}'); fi; if [ \"$BF_ORI_CURRENT\" != \"$BF_ORI_VERSION\" ]; then if ! command -v curl >/dev/null 2>&1 || ! command -v sha256sum >/dev/null 2>&1; then if command -v apt-get >/dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq curl ca-certificates coreutils; elif command -v dnf >/dev/null 2>&1; then dnf -y install curl ca-certificates coreutils; elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates coreutils; else echo 'Ori bootstrap requires curl and sha256sum' >&2; exit 127; fi; fi; BF_ORI_ARCH=$(uname -m); case \"$BF_ORI_ARCH\" in x86_64|amd64) BF_ORI_ARCH=x64 ;; aarch64|arm64) BF_ORI_ARCH=arm64 ;; *) echo \"Unsupported architecture for Ori: $BF_ORI_ARCH\" >&2; exit 1 ;; esac; BF_ORI_LIBC=\"\"; if command -v ldd >/dev/null 2>&1 && ldd --version 2>&1 | grep -qi musl; then BF_ORI_LIBC=-musl; fi; BF_ORI_ASSET=\"ori-linux-${BF_ORI_ARCH}${BF_ORI_LIBC}\"; case \"$BF_ORI_ASSET\" in ori-linux-x64) BF_ORI_SHA=2dffa9f311f8b65fbcbf6a5645c806ba623f14a003010410cd800095bc270b67 ;; ori-linux-arm64) BF_ORI_SHA=d3ee260046c313a785db466db99781fb5acd91bf39ef28384a83ac293f793753 ;; ori-linux-x64-musl) BF_ORI_SHA=b91bb8f01e41f5e8de496b16135db6756c4d71baa30bc230f7990db7e370f837 ;; ori-linux-arm64-musl) BF_ORI_SHA=85a3be536da3337b630f2fa56f3b259961a334f5e7af75c3dd4a5a7873957d34 ;; *) echo \"No checksum for Ori asset: $BF_ORI_ASSET\" >&2; exit 1 ;; esac; BF_ORI_TMP=$(mktemp -d /tmp/benchflow-ori-install.XXXXXX); curl -fsSLo \"$BF_ORI_TMP/$BF_ORI_ASSET\" \"https://github.com/OpenRouterLabs/ori-releases/releases/download/${BF_ORI_RELEASE}/${BF_ORI_ASSET}\"; BF_ORI_ACTUAL=$(sha256sum \"$BF_ORI_TMP/$BF_ORI_ASSET\"); BF_ORI_ACTUAL=${BF_ORI_ACTUAL%% *}; if [ \"$BF_ORI_ACTUAL\" != \"$BF_ORI_SHA\" ]; then echo \"Ori checksum mismatch for $BF_ORI_ASSET\" >&2; exit 1; fi; mkdir -p /opt/benchflow/bin; mv -f \"$BF_ORI_TMP/$BF_ORI_ASSET\" \"$BF_ORI_BIN\"; rmdir \"$BF_ORI_TMP\"; chmod 755 \"$BF_ORI_BIN\"; fi; ORI_TELEMETRY=0 \"$BF_ORI_BIN\" version --human && ( command -v python3 >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null 2>&1) ) && mkdir -p /opt/benchflow/bin && echo  | base64 -d > /opt/benchflow/bin/ori_jsonl.py && chmod +x /opt/benchflow/bin/ori_jsonl.py && ( command -v python3 >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null 2>&1) ) && mkdir -p /opt/benchflow/bin && echo  | base64 -d > /opt/benchflow/bin/ori_events.py && chmod +x /opt/benchflow/bin/ori_events.py && ( command -v python3 >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null 2>&1) ) && mkdir -p /opt/benchflow/bin && echo  | base64 -d > /opt/benchflow/bin/ori-acp-shim && chmod +x /opt/benchflow/bin/ori-acp-shim"
launch_cmd = "/opt/benchflow/bin/ori-acp-shim"
protocol = "acp"
api_protocol = "openai-completions"
acp_model_format = "bare"
supports_acp_set_model = true
install_timeout = 900
default_model = "openrouter/openrouter/auto"
requires_env = ["OPENROUTER_API_KEY"]
skill_paths = ["$WORKSPACE/.agents/skills"]
home_dirs = [".ori", ".openrouter"]
aliases = ["ori"]

[env_mapping]
BENCHFLOW_PROVIDER_BASE_URL = "ORI_OPENROUTER_BASE_URL"
BENCHFLOW_PROVIDER_API_KEY = "OPENROUTER_API_KEY"
BENCHFLOW_PROVIDER_MODEL = "ORI_MODEL"

