contract_version = "1.0"
name = "prime-agent"
description = "Prime Intellect's Prime Agent (self-improving RLM coding agent, MIT, built on pi) over ACP. Single model-facing tool: a persistent IPython kernel; subagents/skills run as Python calls inside it. ACP mode is in-process (no daemon). Model selection is env-owned (no ACP set_model): the launcher writes a models.json declaring one custom OpenAI-compatible provider from BENCHFLOW_PROVIDER_* env and passes --model at launch; the API key reaches Prime Agent by env-var NAME (never written to disk). DeepSeek model ids get the built-in catalog's compat mirrored explicitly (thinkingFormat=deepseek + requiresReasoningContentOnAssistantMessages + thinkingLevelMap) because Prime Agent's base-URL compat autodetection cannot see through the gateway. Install pins release 0.7.1 (self-hosted npm tarball; not on npmjs) and pre-provisions the IPython kernel venv at /opt/benchflow/prime-agent/kernel-venv (uv-managed Python 3.11 + ipykernel + bundled prime-agent-runtime + the default RLM package set) so first tool use needs no network and works under a dropped-privilege sandbox user. The base64-embedded launcher in install_cmd regenerates from launcher.sh in this directory."
install_cmd = '''export DEBIAN_FRONTEND=noninteractive; BF_NODE_DIR=/opt/benchflow/node; BF_NODE_VERSION=22.20.0; if [ ! -x "$BF_NODE_DIR/bin/node" ]; then   if ! command -v curl >/dev/null 2>&1 ||      ! command -v tar >/dev/null 2>&1 ||      ! command -v xz >/dev/null 2>&1; then     if command -v apt-get >/dev/null 2>&1; then       apt-get update -qq &&       apt-get install -y -qq curl ca-certificates tar xz-utils;     elif command -v dnf >/dev/null 2>&1; then       dnf -y install curl ca-certificates tar xz;     elif command -v apk >/dev/null 2>&1; then       apk add --no-cache curl ca-certificates tar xz;     else       echo 'BenchFlow JS agent bootstrap requires curl, tar, and xz' >&2;       exit 127;     fi;   fi;   arch="$(uname -m)";   case "$arch" in     x86_64|amd64) node_arch=x64 ;;     aarch64|arm64) node_arch=arm64 ;;     *) echo "Unsupported architecture for Node.js: $arch" >&2; exit 1 ;;   esac;   tmp="$(mktemp -d)";   mkdir -p /opt/benchflow;   curl -fsSLo "$tmp/node.tar.xz" "https://nodejs.org/dist/v${BF_NODE_VERSION}/node-v${BF_NODE_VERSION}-linux-${node_arch}.tar.xz";   rm -rf "$BF_NODE_DIR";   mkdir -p "$BF_NODE_DIR";   tar -xJf "$tmp/node.tar.xz" -C "$BF_NODE_DIR" --strip-components=1 --no-same-owner;   rm -rf "$tmp"; fi; export PATH="/opt/benchflow/node/bin:$PATH"; "$BF_NODE_DIR/bin/node" --version && mkdir -p /opt/benchflow/js-agents /opt/benchflow/bin /opt/benchflow/prime-agent/home && PA_TGZ=$(mktemp -d)/prime-agent-0.7.1.tgz && curl -fsSLo "$PA_TGZ" https://pub-728493de92a943e2a9b2d17b4719f318.r2.dev/releases/v0.7.1/prime-agent-0.7.1.tgz && echo "d68612c83239caafab72cc76c55ac572bfd07a059ea8fbd2a3ddbe1f2b55dcdb  $PA_TGZ" | sha256sum -c - >/dev/null && ( /opt/benchflow/node/bin/npm install -g --loglevel=error --no-fund --no-audit --prefix /opt/benchflow/js-agents "$PA_TGZ" ) && rm -f "$PA_TGZ" && [ -e /opt/benchflow/js-agents/lib/node_modules/prime-agent/dist/bundle/cli.js ] && if [ ! -x /opt/benchflow/uv/uv ]; then curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/opt/benchflow/uv UV_NO_MODIFY_PATH=1 sh; fi && export UV_PYTHON_INSTALL_DIR=/opt/benchflow/uv/pythons && /opt/benchflow/uv/uv venv --python 3.11 /opt/benchflow/prime-agent/kernel-venv && /opt/benchflow/uv/uv pip install --python /opt/benchflow/prime-agent/kernel-venv/bin/python ipykernel dill /opt/benchflow/js-agents/lib/node_modules/prime-agent/dist/prime-agent-runtime requests httpx pyyaml tomli python-dotenv pandas numpy scipy beautifulsoup4 lxml pydantic tyro && /opt/benchflow/prime-agent/kernel-venv/bin/python -c "import rlm, ipykernel, dill" && ( cd /opt/benchflow/js-agents/lib/node_modules/prime-agent && PRIME_AGENT_BOOTSTRAP_TOOLS_ON_INSTALL=1 PRIME_AGENT_CODING_AGENT_DIR=/opt/benchflow/prime-agent/home /opt/benchflow/node/bin/node postinstall.cjs || echo "prime-agent: fd/rg preload skipped (non-fatal)" >&2 ) && printf '%s\n' '#!/bin/sh' 'exec /opt/benchflow/node/bin/node /opt/benchflow/js-agents/lib/node_modules/prime-agent/dist/bundle/cli.js "$@"' > /opt/benchflow/bin/prime-agent && chmod +x /opt/benchflow/bin/prime-agent && echo  | base64 -d > /opt/benchflow/bin/prime-agent-acp && chmod +x /opt/benchflow/bin/prime-agent-acp && chmod -R a+rwX /opt/benchflow/prime-agent/home && chmod -R a+rX /opt/benchflow/prime-agent /opt/benchflow/uv /opt/benchflow/js-agents && [ -x /opt/benchflow/bin/prime-agent-acp ] && [ -x /opt/benchflow/prime-agent/kernel-venv/bin/python ]'''
launch_cmd = '''/opt/benchflow/bin/prime-agent-acp'''
protocol = "acp"
api_protocol = "openai-completions"
acp_model_format = "bare"
supports_acp_set_model = false
install_timeout = 1200
aliases = ["prime"]

[env_mapping]
BENCHFLOW_PROVIDER_BASE_URL = "PRIME_AGENT_PROVIDER_BASE_URL"
BENCHFLOW_PROVIDER_API_KEY = "PRIME_AGENT_PROVIDER_API_KEY"
BENCHFLOW_PROVIDER_MODEL = "PRIME_AGENT_MODEL"
